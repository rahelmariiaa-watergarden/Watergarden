<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Multi-Window Viewer</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100vw;
      height: 100vh;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.92);
      color: white;
      z-index: 9999;
      text-align: center;
      padding: 2rem;
    }

    #startButton {
      margin-top: 1rem;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .top-label {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10000;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 14px;
      display: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .top-label.paused {
      background: rgba(130, 0, 0, 0.75);
    }

    .top-label .icon {
      margin-right: 6px;
    }

    .ar-window {
      position: fixed;
      box-sizing: border-box;
      width: 420px;
      min-width: 0;
      min-height: 0;
      z-index: 9998;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      user-select: none;
      -webkit-user-select: none;
      display: none;
      pointer-events: auto;
    }

    .ar-window.fullscreen {
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      border-radius: 0 !important;
    }

    .ar-header {
      box-sizing: border-box;
      height: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      position: relative;
      z-index: 10;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      pointer-events: auto;
    }

    .ar-title {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .ar-title:active {
      cursor: grabbing;
    }

    .ar-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
      position: relative;
      z-index: 11;
    }

    .iconBtn {
      box-sizing: border-box;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      font-size: 19px;
      line-height: 1;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .iconBtn:focus-visible,
    #startButton:focus-visible {
      outline: 3px solid #4da3ff;
      outline-offset: 2px;
    }

    .ar-content {
      position: relative;
      width: 100%;
      height: calc(100% - 48px);
      overflow: hidden;
      background: black;
      margin: 0;
      padding: 0;
    }

    .ar-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      margin: 0;
      padding: 0;
      background: black;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .ar-video,
    .ar-iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      margin: 0;
      padding: 0;
      background: black;
    }

    .iframeWrap {
      position: relative;
      width: 100%;
      height: 100%;
      background: black;
    }

    .statusText {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 12px;
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .retryBtn {
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      padding: 0.6rem 0.9rem;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .resizeHandle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 32px;
      height: 32px;
      cursor: nwse-resize;
      z-index: 20;
      touch-action: none;
      background: linear-gradient(
        135deg,
        transparent 0%,
        transparent 50%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0.55) 65%,
        transparent 65%
      );
    }

    @media (max-width: 480px) {
      .ar-header {
        padding-left: 8px;
        padding-right: 6px;
      }

      .ar-buttons {
        gap: 4px;
      }

      .iconBtn {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body>
  <div id="startOverlay">
    <div>
      <h1>AR Multi-Window Viewer</h1>
      <p>Tap to start camera and scan the target image.</p>
      <button id="startButton" type="button">Start AR</button>
    </div>
  </div>

  <div id="topLabel" class="top-label">
    <span class="icon">◉</span>
    <span id="scanLabelText">Scanning</span>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="target2" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="target3" mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity id="target4" mindar-image-target="targetIndex: 4"></a-entity>
    <a-entity id="target5" mindar-image-target="targetIndex: 5"></a-entity>
    <a-entity id="target6" mindar-image-target="targetIndex: 6"></a-entity>
    <a-entity id="target7" mindar-image-target="targetIndex: 7"></a-entity>
    <a-entity id="target8" mindar-image-target="targetIndex: 8"></a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const STORAGE_KEY = "ar_window_state_v2";

      const CONTENT = {
        0: { title: "Bilderreihe", type: "image", src: "./images/Sensorgif.gif", aspect: 3 / 4 },
        1: { title: "Datenerstellen", type: "video", src: "./images/Datenerstellen.mp4", aspect: 16 / 10 },
        2: { title: "S6video", type: "video", src: "./images/S6video.mp4", aspect: 16 / 9 },
        3: { title: "CT", type: "image", src: "./images/CT.gif", aspect: 4 / 3 },
        4: { title: "PS", type: "image", src: "./images/PS.gif", aspect: 4 / 3 },
        5: { title: "IP", type: "image", src: "./images/IP.gif", aspect: 4 / 3 },
        6: { title: "EC", type: "image", src: "./images/EC.gif", aspect: 4 / 3 },
        7: { title: "ECM", type: "image", src: "./images/ECM.gif", aspect: 4 / 3 },
        8: { title: "CV", type: "image", src: "./images/CV.gif", aspect: 4 / 3 }
      };

      const startOverlay = document.getElementById("startOverlay");
      const startButton = document.getElementById("startButton");
      const scene = document.getElementById("scene");
      const topLabel = document.getElementById("topLabel");
      const scanLabelText = document.getElementById("scanLabelText");

      const openWindows = {};
      let zCounter = 10000;
      let scanPaused = false;
      let activeGesture = null;

      function isDesktop() {
        return window.matchMedia("(pointer: fine)").matches && window.innerWidth >= 900;
      }

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function loadState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function saveState(state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {}
      }

      function getAvailableSize() {
        return {
          width: Math.max(1, window.innerWidth - 16),
          height: Math.max(1, window.innerHeight - 16)
        };
      }

      function fitWindowSize(item) {
        const available = getAvailableSize();
        const preferredWidth = item.type === "iframe"
          ? (isDesktop() ? 520 : 380)
          : (isDesktop() ? 420 : 380);

        const width = Math.min(preferredWidth, available.width);
        const aspect = item.aspect || 16 / 9;
        const contentHeight = Math.round(width / aspect);
        const height = Math.min(contentHeight + 48, available.height);

        return { width, height };
      }

      function clampPosition(left, top, width, height) {
        const maxLeft = Math.max(0, window.innerWidth - width);
        const maxTop = Math.max(0, window.innerHeight - Math.min(48, height));

        return {
          left: Math.max(0, Math.min(left, maxLeft)),
          top: Math.max(0, Math.min(top, maxTop))
        };
      }

      function getOccupiedRects() {
        return Object.values(openWindows).map(win => win.getBoundingClientRect());
      }

      function rectsOverlap(a, b, padding = 24) {
        return !(
          a.right + padding < b.left ||
          a.left - padding > b.right ||
          a.bottom + padding < b.top ||
          a.top - padding > b.bottom
        );
      }

      function findFreePosition(width, height, preferred) {
        const margin = 12;
        const maxX = Math.max(margin, window.innerWidth - width - margin);
        const maxY = Math.max(64, window.innerHeight - height - margin);

        if (preferred) {
          const pos = clampPosition(preferred.left, preferred.top, width, height);
          const test = {
            left: pos.left,
            top: pos.top,
            right: pos.left + width,
            bottom: pos.top + height
          };

          if (!getOccupiedRects().some(rect => rectsOverlap(test, rect))) {
            return pos;
          }
        }

        if (!isDesktop()) {
          return clampPosition(12, 76, width, height);
        }

        const occupied = getOccupiedRects();

        for (let i = 0; i < 40; i++) {
          const left = rand(margin, maxX);
          const top = rand(Math.min(76, maxY), maxY);
          const test = {
            left,
            top,
            right: left + width,
            bottom: top + height
          };

          if (!occupied.some(rect => rectsOverlap(test, rect))) {
            return { left, top };
          }
        }

        return {
          left: rand(margin, maxX),
          top: rand(Math.min(76, maxY), maxY)
        };
      }

      function updateScanLabel(paused) {
        scanLabelText.textContent = paused ? "Scanning paused" : "Scanning";
        topLabel.classList.toggle("paused", paused);
      }

      function setScanState(paused) {
        scanPaused = paused;
        updateScanLabel(paused);

        const system = scene.systems && scene.systems["mindar-image-system"];
        if (!system) return;

        try {
          if (paused) system.stop?.();
          else system.start?.();
        } catch (err) {
          console.warn("Could not toggle scanning:", err);
        }
      }

      topLabel.addEventListener("click", () => {
        setScanState(!scanPaused);
      });

      /*
       * Do not preventDefault() on pointerdown for buttons:
       * that can suppress the synthesized click on touch devices.
       */
      function bindButton(button, handler) {
        button.addEventListener("pointerdown", event => {
          event.stopPropagation();
        });

        button.addEventListener("click", event => {
          event.stopPropagation();
          handler();
        });
      }

      function createIframeFallback(wrap, iframeEl, statusEl) {
        let loaded = false;
        let timeoutId = null;

        const retryBtn = document.createElement("button");
        retryBtn.className = "retryBtn";
        retryBtn.type = "button";
        retryBtn.textContent = "Retry";

        function showError(message) {
          statusEl.style.display = "block";
          statusEl.innerHTML = "";
          statusEl.append(document.createTextNode(message), document.createElement("br"));
          statusEl.appendChild(retryBtn);
        }

        iframeEl.addEventListener("load", () => {
          loaded = true;
          clearTimeout(timeoutId);
          statusEl.style.display = "none";
        });

        timeoutId = setTimeout(() => {
          if (!loaded) showError("Viewer did not load.");
        }, 8000);

        retryBtn.addEventListener("click", () => {
          loaded = false;
          statusEl.textContent = "Retrying...";
          iframeEl.src = iframeEl.src;
          clearTimeout(timeoutId);

          timeoutId = setTimeout(() => {
            if (!loaded) showError("Viewer did not load.");
          }, 8000);
        });
      }

      function persistWindow(index, win) {
        if (win.classList.contains("fullscreen")) return;

        const state = loadState();
        state[index] = {
          left: win.offsetLeft,
          top: win.offsetTop,
          width: win.offsetWidth,
          height: win.offsetHeight
        };
        saveState(state);
      }

      function makeWindow(index) {
        const item = CONTENT[index];
        if (!item) return;

        const state = loadState();
        const saved = state[index];

        if (openWindows[index]) {
          const existing = openWindows[index];
          existing.style.display = "block";
          existing.style.zIndex = String(++zCounter);
          return;
        }

        const defaultSize = fitWindowSize(item);
        const available = getAvailableSize();

        const width = Math.min(
          Math.max(1, Number(saved?.width) || defaultSize.width),
          available.width
        );

        const height = Math.min(
          Math.max(1, Number(saved?.height) || defaultSize.height),
          available.height
        );

        const pos = findFreePosition(
          width,
          height,
          saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)
            ? { left: saved.left, top: saved.top }
            : null
        );

        const win = document.createElement("div");
        win.className = "ar-window";
        win.style.display = "block";
        win.style.width = `${width}px`;
        win.style.height = `${height}px`;
        win.style.left = `${pos.left}px`;
        win.style.top = `${pos.top}px`;
        win.style.zIndex = String(++zCounter);

        const header = document.createElement("div");
        header.className = "ar-header";

        const title = document.createElement("div");
        title.className = "ar-title";
        title.textContent = item.title;
        title.setAttribute("aria-label", `Drag ${item.title} window`);

        const buttons = document.createElement("div");
        buttons.className = "ar-buttons";

        const fullBtn = document.createElement("button");
        fullBtn.className = "iconBtn";
        fullBtn.type = "button";
        fullBtn.textContent = "⛶";
        fullBtn.title = "Maximize or restore";
        fullBtn.setAttribute("aria-label", "Maximize or restore window");

        const closeBtn = document.createElement("button");
        closeBtn.className = "iconBtn";
        closeBtn.type = "button";
        closeBtn.textContent = "×";
        closeBtn.title = "Close";
        closeBtn.setAttribute("aria-label", "Close window");

        let pauseBtn = null;

        if (item.type === "video") {
          pauseBtn = document.createElement("button");
          pauseBtn.className = "iconBtn";
          pauseBtn.type = "button";
          pauseBtn.textContent = "⏸";
          pauseBtn.title = "Pause or play";
          pauseBtn.setAttribute("aria-label", "Pause or play video");
        }

        buttons.appendChild(fullBtn);
        if (pauseBtn) buttons.appendChild(pauseBtn);
        buttons.appendChild(closeBtn);

        header.appendChild(title);
        header.appendChild(buttons);

        const content = document.createElement("div");
        content.className = "ar-content";

        let videoEl = null;
        let fullscreenRestore = null;

        function applyFullscreen(on) {
          if (on && !win.classList.contains("fullscreen")) {
            fullscreenRestore = {
              left: win.offsetLeft,
              top: win.offsetTop,
              width: win.offsetWidth,
              height: win.offsetHeight
            };

            win.classList.add("fullscreen");
            fullBtn.textContent = "⛶";
            fullBtn.title = "Restore window";
          } else if (!on && win.classList.contains("fullscreen")) {
            win.classList.remove("fullscreen");

            const restore = fullscreenRestore || {
              left: pos.left,
              top: pos.top,
              width: defaultSize.width,
              height: defaultSize.height
            };

            const maxWidth = Math.max(1, window.innerWidth - 16);
            const maxHeight = Math.max(1, window.innerHeight - 16);
            const restoreWidth = Math.min(restore.width, maxWidth);
            const restoreHeight = Math.min(restore.height, maxHeight);
            const restorePos = clampPosition(
              restore.left,
              restore.top,
              restoreWidth,
              restoreHeight
            );

            win.style.width = `${restoreWidth}px`;
            win.style.height = `${restoreHeight}px`;
            win.style.left = `${restorePos.left}px`;
            win.style.top = `${restorePos.top}px`;

            fullscreenRestore = null;
            fullBtn.title = "Maximize window";
            persistWindow(index, win);
          }
        }

        bindButton(fullBtn, () => {
          applyFullscreen(!win.classList.contains("fullscreen"));
        });

        bindButton(closeBtn, () => {
          if (videoEl) {
            videoEl.pause();
            videoEl.removeAttribute("src");
            videoEl.load();
          }

          if (activeGesture?.win === win) activeGesture = null;

          win.remove();
          delete openWindows[index];

          const currentState = loadState();
          delete currentState[index];
          saveState(currentState);
        });

        if (item.type === "video") {
          videoEl = document.createElement("video");
          videoEl.className = "ar-video";
          videoEl.src = item.src;
          videoEl.muted = true;
          videoEl.loop = true;
          videoEl.playsInline = true;
          videoEl.setAttribute("playsinline", "");
          videoEl.preload = "auto";

          bindButton(pauseBtn, () => {
            if (videoEl.paused) {
              videoEl.play().catch(() => {});
              pauseBtn.textContent = "⏸";
              pauseBtn.title = "Pause video";
            } else {
              videoEl.pause();
              pauseBtn.textContent = "▶";
              pauseBtn.title = "Play video";
            }
          });

          content.appendChild(videoEl);
          videoEl.play().catch(() => {});
        } else if (item.type === "image") {
          const imgEl = document.createElement("img");
          imgEl.className = "ar-image";
          imgEl.src = item.src;
          imgEl.alt = item.title || "";
          imgEl.draggable = false;
          content.appendChild(imgEl);
        } else if (item.type === "iframe") {
          const wrap = document.createElement("div");
          wrap.className = "iframeWrap";

          const status = document.createElement("div");
          status.className = "statusText";
          status.textContent = "Loading viewer...";
          wrap.appendChild(status);

          const iframeEl = document.createElement("iframe");
          iframeEl.className = "ar-iframe";
          iframeEl.src = item.src;
          iframeEl.allow = "fullscreen";
          wrap.appendChild(iframeEl);

          createIframeFallback(wrap, iframeEl, status);
          content.appendChild(wrap);
        }

        const resizeHandle = document.createElement("div");
        resizeHandle.className = "resizeHandle";
        resizeHandle.setAttribute("aria-label", "Resize window");

        content.appendChild(resizeHandle);
        win.appendChild(header);
        win.appendChild(content);
        document.body.appendChild(win);
        openWindows[index] = win;

        // Deliberately do not restore fullscreen automatically.
        persistWindow(index, win);

        function beginGesture(event, type, captureElement) {
          if (event.button !== undefined && event.button !== 0) return;
          if (win.classList.contains("fullscreen")) return;

          event.preventDefault();
          event.stopPropagation();

          win.style.zIndex = String(++zCounter);

          const rect = win.getBoundingClientRect();

          activeGesture = {
            win,
            type,
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startLeft: rect.left,
            startTop: rect.top,
            startWidth: rect.width,
            startHeight: rect.height
          };

          try {
            captureElement.setPointerCapture(event.pointerId);
          } catch {}
        }

        title.addEventListener("pointerdown", event => {
          beginGesture(event, "drag", title);
        });

        resizeHandle.addEventListener("pointerdown", event => {
          beginGesture(event, "resize", resizeHandle);
        });
      }

      document.addEventListener("pointermove", event => {
        if (!activeGesture || event.pointerId !== activeGesture.pointerId) return;

        const { win, type, startX, startY, startLeft, startTop, startWidth, startHeight } =
          activeGesture;

        if (!win.isConnected || win.classList.contains("fullscreen")) {
          activeGesture = null;
          return;
        }

        if (type === "drag") {
          const newLeft = startLeft + (event.clientX - startX);
          const newTop = startTop + (event.clientY - startY);
          const position = clampPosition(
            newLeft,
            newTop,
            win.offsetWidth,
            win.offsetHeight
          );

          win.style.left = `${position.left}px`;
          win.style.top = `${position.top}px`;
        } else {
          const available = getAvailableSize();
          const maxWidth = Math.max(1, window.innerWidth - win.offsetLeft);
          const maxHeight = Math.max(1, window.innerHeight - win.offsetTop);
          const minWidth = Math.min(240, maxWidth);
          const minHeight = Math.min(180, maxHeight);

          const newWidth = Math.max(
            minWidth,
            Math.min(maxWidth, startWidth + (event.clientX - startX))
          );

          const newHeight = Math.max(
            minHeight,
            Math.min(maxHeight, startHeight + (event.clientY - startY))
          );

          win.style.width = `${Math.min(newWidth, available.width)}px`;
          win.style.height = `${Math.min(newHeight, available.height)}px`;
        }

        persistWindow(
          Object.keys(openWindows).find(key => openWindows[key] === win),
          win
        );
      });

      function endGesture(event) {
        if (!activeGesture) return;
        if (event.pointerId !== undefined && event.pointerId !== activeGesture.pointerId) return;
        activeGesture = null;
      }

      document.addEventListener("pointerup", endGesture);
      document.addEventListener("pointercancel", endGesture);

      window.addEventListener("resize", () => {
        Object.entries(openWindows).forEach(([index, win]) => {
          if (win.classList.contains("fullscreen")) return;

          const width = Math.min(win.offsetWidth, window.innerWidth - 16);
          const height = Math.min(win.offsetHeight, window.innerHeight - 16);
          const position = clampPosition(
            win.offsetLeft,
            win.offsetTop,
            width,
            height
          );

          win.style.width = `${Math.max(1, width)}px`;
          win.style.height = `${Math.max(1, height)}px`;
          win.style.left = `${position.left}px`;
          win.style.top = `${position.top}px`;

          persistWindow(index, win);
        });
      });

      startButton.addEventListener("click", async () => {
        try {
          const system = scene.systems["mindar-image-system"];
          if (!system) throw new Error("MindAR system not ready");

          await system.start();
          startOverlay.style.display = "none";
          topLabel.style.display = "block";
          updateScanLabel(false);
        } catch (err) {
          console.error("Could not start AR:", err);
          alert("Could not start AR.");
        }
      });

      Object.keys(CONTENT).forEach(key => {
        const target = document.getElementById("target" + key);
        if (target) {
          target.addEventListener("targetFound", () => {
            makeWindow(Number(key));
          });
        }
      });
    });
  </script>
</body>
</html>
